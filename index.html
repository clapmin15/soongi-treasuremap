<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="숭이가 좋아하는 장소들을 모은 보물지도">
  <title>메인 | 숭이의 보물지도</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=Hahmlet:wght@100..900&family=Moirai+One&family=Orbit&family=Stylish&display=swap" rel="stylesheet">
</head>
<body data-region="">
  <div class="page-wrap">

    <header class="site-header">
      <a class="brand" href="index.html">🏴‍☠️ 숭이의 보물지도</a>
      <button id="hamburger" class="hamburger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-menu">☰</button>
      <nav id="site-menu" class="menu" aria-label="페이지 이동">
        <a href="index.html">🏠 메인</a>
        <a href="top.html">📍 수도권</a>
        <a href="middle.html">📍 중부·강원</a>
        <a href="bottom.html">📍 남부</a>
        <span class="menu-divider"></span>
        <button type="button" id="authOpen" class="menu-login">🔐 관리자 로그인</button>
        <button type="button" id="logoutBtn" class="menu-login" hidden>🚪 로그아웃</button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow">SOONGI'S TREASURE MAP</span>
          <h1>오늘은 어디로<br>떠나볼까♪</h1>
          <p>내 마음에 반짝이는 장소들을 모아 둔 작은 보물지도.<br>마음에 드는 지역을 골라 함께 떠나 보자!</p>

          <div class="region-links">
            <a class="region-button pink" href="top.html">📍 수도권 <span>→</span></a>
            <a class="region-button yellow" href="middle.html">⛰️ 중부·강원 <span>→</span></a>
            <a class="region-button green" href="bottom.html">🌊 남부 <span>→</span></a>
          </div>

          <a class="secret-star" href="secret.html" aria-label="비밀 페이지로 이동">⭐ <span style="font-family: 'Hahmlet', sans-serif;">비밀 보물 찾기</span></a>
        </div>

        <div class="hero-art">
          <img class="treasure-map" src="assets/draft_4.png" alt="손으로 그린 해적 보물지도">
          <div class="monkey-frame">
            <img class="monkey" src="assets/index_img.png" alt="보물은 우리의 일상에 있어! 바나나를 든 숭이 삼형제">
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 숭이의 보물지도 · 내가 좋아하는 장소의 기록</span>
      <a id="repoLink" href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub 저장소 ↗ (주소 설정 필요)</a>
    </footer>

  </div>

  <dialog id="loginDialog" class="login-dialog">
    <form id="loginForm" class="login-form">
      <button type="button" id="loginClose" class="close" aria-label="닫기">×</button>
      <h2>🔐 관리자 로그인</h2>
      <p>보물지도를 관리하는 숭이만 입장할 수 있어요.</p>
      <label>이메일
        <input id="loginEmail" type="email" autocomplete="username" required placeholder="이메일 주소">
      </label>
      <label>비밀번호
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="비밀번호">
      </label>
      <button class="primary" type="submit">로그인</button>
      <p id="loginStatus" class="status" role="status"></p>
    </form>
  </dialog>

  <script type="module" src="js/script.js"></script>
</body>
</html>
